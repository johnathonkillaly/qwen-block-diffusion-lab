[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdif"
version = "0.1.0"
description = "Qwen Diffusion Lab: converting an autoregressive Qwen3.5 into a block-discrete diffusion LM via parameter-efficient adaptation. Experimental research harness."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=5.8",
    "tokenizers",
    "safetensors",
    "accelerate",
    "numpy",
    "pyyaml",
    "rich",
    "psutil",
]

[project.optional-dependencies]
mlx = ["mlx>=0.29", "mlx-lm>=0.28"]
dev = ["pytest>=8", "pytest-timeout"]

[project.scripts]
qdif = "qdif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires a real Qwen3.5 checkpoint on disk (slow)",
    "mlx: requires the MLX backend",
    "slow: long-running",
]
filterwarnings = ["ignore::UserWarning"]
