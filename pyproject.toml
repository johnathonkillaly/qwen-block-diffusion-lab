[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdif"
version = "0.1.0"
description = "Qwen Diffusion Lab: an Apple Silicon / MLX research lab on AR-to-diffusion conversion of Qwen3.5, including negative results and a FLARE-inspired reproduction."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["diffusion-llm", "qwen", "mlx", "apple-silicon", "unsloth", "gated-deltanet"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=5.8",
    "tokenizers",
    "safetensors",
    "accelerate",
    "numpy",
    "pyyaml",
    "rich",
    "psutil",
]

[project.optional-dependencies]
mlx = ["mlx>=0.29", "mlx-lm>=0.28"]
# Optional. Provides the Qwen3.5 Gated DeltaNet custom VJP on Apple Silicon.
# The harness runs without it -- see THIRD_PARTY.md for the licence discrepancy.
unsloth = ["unsloth", "unsloth_zoo"]
dev = ["pytest>=8", "pytest-timeout"]

[project.scripts]
qdif = "qdif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires a real Qwen3.5 checkpoint on disk (slow)",
    "mlx: requires the MLX backend",
    "slow: long-running",
]
filterwarnings = ["ignore::UserWarning"]
